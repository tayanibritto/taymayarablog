name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Clonar repositório
              uses: actions/checkout@v4

            - name: Configurar Node
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Instalar dependências
              run: npm ci

            - name: Rodar lint
              run: npm run lint

            - name: Rodar testes
              run: npm run test

            - name: Rodar build
              run: npm run build
              env:
                NEXT_PUBLIC_CRUD_API_URL: ${{ secrets.NEXT_PUBLIC_CRUD_API_URL }}
                NEXT_PUBLIC_CRUD_API_KEY: ${{ secrets.NEXT_PUBLIC_CRUD_API_KEY }}
                NEXT_PUBLIC_CRUD_API_COLLECTION: ${{ secrets.NEXT_PUBLIC_CRUD_API_COLLECTION }}
